# ═══ Docker Compose — EST Website Production Stack ═══
# รัน: docker compose up -d
# ประกอบด้วย 4 services: app (Nuxt), nginx (reverse proxy), postgres (DB), redis (cache)

services:
  # ── แอป Nuxt (SSR) ──
  # build จาก docker/Dockerfile → รันที่ port 3000
  # ต้อง postgres + redis พร้อมก่อนถึงจะ start
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - media_uploads:/app/public/uploads  # ไฟล์ที่ upload เก็บถาวรใน volume

  # ── PostgreSQL 16 (ฐานข้อมูลหลัก) ──
  # ข้อมูลเก็บใน volume 'pgdata' → ลบ container ไม่เสียข้อมูล
  # ⚠️ POSTGRES_PASSWORD ต้องตั้งใน .env (ห้ามเว้นว่าง)
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-est_website}
      POSTGRES_USER: ${POSTGRES_USER:-est_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-est_admin}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis 7 (Cache + Rate Limit) ──
  # จำกัด memory 128MB, ลบ key เก่าอัตโนมัติ (allkeys-lru)
  # ⚠️ ถ้า Redis ล่ม แอปยังทำงานได้ (graceful degradation)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Nginx (Reverse Proxy + SSL) ──
  # ทำหน้าที่: รับ request จากข้างนอก → ส่งต่อไป app:3000
  # SSL cert เก็บใน ./certbot/conf (จาก Let's Encrypt)
  # config อยู่ที่ docker/nginx/default.conf
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app

# ── Volumes (ข้อมูลถาวร) ──
# pgdata: ฐานข้อมูล PostgreSQL
# media_uploads: ไฟล์รูปภาพ/วิดีโอที่ upload
volumes:
  pgdata:
  media_uploads:
