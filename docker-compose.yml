# ═══ Docker Compose — EST Website Production Stack ═══
# รัน: docker compose up -d
# ประกอบด้วย 4 services: app (Nuxt), nginx (reverse proxy), postgres (DB), redis (cache)
#
# Network policy:
# - postgres + redis อยู่ใน internal network เท่านั้น (ไม่เปิด port ออกข้างนอก)
# - app + nginx เข้าถึงได้ ผ่าน hostname ภายใน Docker network
# - ถ้าต้องเข้า DB จากเครื่อง dev ให้ใช้ SSH tunnel: ssh -L 5432:localhost:5432 user@host

services:
  # ── แอป Nuxt (SSR) ──
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_uploads:/app/public/uploads
    networks:
      - est_internal
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── PostgreSQL 16 (ฐานข้อมูลหลัก) ──
  # ⚠️ ไม่เปิด port สาธารณะ — เข้าถึงผ่าน Docker network เท่านั้น
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-est_website}
      POSTGRES_USER: ${POSTGRES_USER:-est_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - est_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-est_admin}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── Redis 7 (Cache + Rate Limit) ──
  # ⚠️ ไม่เปิด port สาธารณะ + ตั้งรหัสผ่านผ่าน REDIS_PASSWORD
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks:
      - est_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ── Nginx (Reverse Proxy + SSL) ──
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - est_internal
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

# ── Volumes (ข้อมูลถาวร) ──
volumes:
  pgdata:
  media_uploads:

# ── Internal-only network ──
# postgres + redis เข้าถึงได้เฉพาะใน network นี้
networks:
  est_internal:
    driver: bridge
