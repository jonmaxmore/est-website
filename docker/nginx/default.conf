# ═══════════════════════════════════════
# Nginx — HTTP only (สำหรับช่วงตั้ง SSL ครั้งแรก)
# หลังจากรัน setup-ssl.sh แล้วจะถูก replace ด้วย ssl.conf
# ═══════════════════════════════════════

# ── Hide nginx version ──
server_tokens off;

# ── Rate limit zones (shared across server blocks) ──
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=tracking_zone:10m rate=10r/s;

upstream app_backend {
    server app:3000;
}

server {
    listen 80;
    # Catch-all: รับทุก hostname (ใช้ตอนยังไม่มีโดเมนจริง / เข้าผ่าน IP)
    server_name _;

    # Let's Encrypt ACME challenge (กันไว้ก่อนแม้ยังไม่มี SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Block dotfiles ──
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    client_max_body_size 110M;

    # ── Static assets (immutable hashes) ──
    location /_nuxt/ {
        proxy_pass http://app_backend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /images/ {
        proxy_pass http://app_backend;
        add_header Cache-Control "public, max-age=86400";
    }

    location /uploads/ {
        proxy_pass http://app_backend;
        add_header Cache-Control "public, max-age=86400";
        # ห้ามรัน script จาก uploads (defense in depth)
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Login: throttle hard ──
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache" always;
    }

    # ── Tracking: medium throttle ──
    location = /api/track {
        limit_req zone=tracking_zone burst=20 nodelay;
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache" always;
    }

    # ── Media Upload: large file support ──
    location /api/admin/media/upload {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 110M;
        add_header Cache-Control "no-store, no-cache" always;
    }

    # ── API: no cache ──
    location /api/ {
        limit_req zone=api_zone burst=120 nodelay;
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache" always;
    }

    # ── Main reverse proxy ──
    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }
}
