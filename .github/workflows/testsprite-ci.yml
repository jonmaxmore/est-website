# ═══════════════════════════════════════
# TestSprite CI — Automated Testing on PR
# EST-Website (Nuxt 4 + Docker + DigitalOcean)
# ═══════════════════════════════════════
#
# Required secrets:
#   TESTSPRITE_API_KEY  — from TestSprite Web Portal > API Keys
#   DO_HOST             — Server IP
#   DO_USER             — Server user (root)
#   DO_PASSWORD         — Server password
#   DATABASE_URL        — PostgreSQL connection string
#   NUXT_SESSION_PASSWORD — Session secret

name: TestSprite CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  PREVIEW_PORT: 3001

jobs:
  # ── Step 1: Deploy preview on Digital Ocean ──
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Preview to Digital Ocean
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          script: |
            cd /root/est-website
            git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-${{ github.event.pull_request.number }} 2>/dev/null || git fetch origin
            git checkout pr-${{ github.event.pull_request.number }} 2>/dev/null || git checkout main
            
            docker build -t est-preview -f docker/Dockerfile .
            docker stop est-preview 2>/dev/null || true
            docker rm est-preview 2>/dev/null || true
            
            docker run -d \
              --name est-preview \
              --network est-website_default \
              -p 3001:3000 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e REDIS_URL="redis://redis:6379" \
              -e NODE_ENV=production \
              -e NUXT_SESSION_PASSWORD="${{ secrets.NUXT_SESSION_PASSWORD }}" \
              est-preview
            
            sleep 10
            curl -sf http://localhost:3001 > /dev/null && echo "Preview OK" || echo "Preview failed"
            git checkout main

  # ── Step 2: Run TestSprite Tests ──
  test:
    needs: deploy-preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TestSprite Action
        uses: TestSprite/run-action@v1
        with:
          testsprite-api-key: ${{ secrets.TESTSPRITE_API_KEY }}
          base_url: http://${{ secrets.DO_HOST }}:3001
          blocking: 'true'

  # ── Step 3: Cleanup ──
  cleanup:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Cleanup Preview
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          password: ${{ secrets.DO_PASSWORD }}
          script: |
            docker stop est-preview 2>/dev/null || true
            docker rm est-preview 2>/dev/null || true
            docker rmi est-preview 2>/dev/null || true
