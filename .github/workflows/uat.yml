# ═══════════════════════════════════════
# UAT — Run 3 Personas walkthrough on production
# ═══════════════════════════════════════
#
# Triggers:
#   - workflow_dispatch (manual)
#   - daily 06:00 UTC (smoke test schedule)
#   - after every successful production deploy
#
# Required secrets:
#   UAT_BASE_URL          — e.g. http://178.128.127.161
#   UAT_ADMIN_EMAIL       — admin login email
#   UAT_ADMIN_PASSWORD    — admin login password (rotate from .env on server)

name: UAT — 3 Personas Walkthrough

on:
  workflow_dispatch:
  schedule:
    # Daily smoke at 06:00 UTC (13:00 Bangkok)
    - cron: '0 6 * * *'
  workflow_run:
    workflows: ['Deploy Production']
    types: [completed]

jobs:
  uat:
    name: 3 Personas Walkthrough
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke + public personas + admin personas
        env:
          BASE_URL: ${{ secrets.UAT_BASE_URL }}
          UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
          UAT_ADMIN_PASSWORD: ${{ secrets.UAT_ADMIN_PASSWORD }}
          # Some specs reuse TEST_ADMIN_* aliases
          TEST_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.UAT_ADMIN_PASSWORD }}
        run: |
          npx playwright test \
            e2e/smoke/production.spec.ts \
            e2e/uat/personas.spec.ts \
            e2e/uat/admin-personas.spec.ts \
            --project='Desktop Chrome' \
            --reporter=list,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload UAT public personas screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-public-screenshots
          path: test-results/uat-personas/
          retention-days: 30

      - name: Upload UAT admin personas screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uat-admin-screenshots
          path: test-results/uat-admin-personas/
          retention-days: 30
