# ═══════════════════════════════════════
# PR E2E — local-server smoke + api
# ═══════════════════════════════════════
#
# Runs Playwright e2e/smoke + e2e/api against a Nuxt server spun up
# locally inside the runner, with postgres + redis service containers.
#
# This is the PR-time complement to:
#   - e2e.yml  (push-to-main, against production)
#   - uat.yml  (scheduled + post-deploy, against production)
#
# Scope intentionally excludes:
#   - "Security headers" describe in smoke (asserts nginx-only behaviour
#     like server_tokens off — won't pass without nginx in front)
#   - e2e/admin/* (would require seeded admin credentials in CI secrets)
#   - e2e/uat/*   (covered by uat.yml against real production)
#
# Test admin credentials are baked into the workflow env (the DB is
# disposable and lives only for the run), so no GitHub secrets are
# required.

name: PR E2E (local server)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  e2e-local:
    name: E2E smoke + api (local server)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: est_admin
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: est_website
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U est_admin -d est_website"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://est_admin:ci-test-password@localhost:5432/est_website
      REDIS_URL: redis://localhost:6379
      NUXT_SESSION_PASSWORD: ci-session-password-padded-to-32-chars-min
      ANALYTICS_IP_SALT: ci-analytics-salt-fake-value-32-chars
      WEBHOOK_SECRET: ci-webhook-secret-fake-value-32-chars
      ADMIN_SEED_EMAIL: admin@example.dev
      ADMIN_SEED_PASSWORD: ciTestAdmin_pwd!2026
      NUXT_PUBLIC_SITE_URL: http://localhost:3000
      NUXT_PUBLIC_SITE_NAME: Eternal Tower Saga
      BASE_URL: http://localhost:3000
      # NODE_ENV is intentionally NOT set at job level. Setting it to
      # 'production' makes npm skip optionalDependencies, which breaks
      # esbuild's platform-specific binary install (and any other native
      # bin install relying on optional deps). Only set NODE_ENV on the
      # specific steps that need it (currently none — Nuxt's runtime is
      # configured via runtimeConfig, not NODE_ENV).

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Wait for postgres to be reachable
        id: pg-wait
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/5432) 2>/dev/null; then
              echo "postgres TCP open after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "postgres TCP did not open within 60s"
          exit 1

      - name: Apply database migrations
        id: migrate
        run: npx prisma migrate deploy

      - name: Seed database
        id: seed
        run: npm run db:seed

      - name: Build Nuxt
        id: build
        run: npm run build

      - name: Install Playwright (chromium)
        id: pw-install
        run: npx playwright install --with-deps chromium

      - name: Start Nuxt server
        id: start-server
        run: |
          node .output/server/index.mjs > nuxt.log 2>&1 &
          echo $! > nuxt.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/public/site > /dev/null 2>&1; then
              echo "Server ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start within 60s"
          echo "─── nuxt.log ───"
          cat nuxt.log
          exit 1

      - name: Run smoke + api e2e
        id: e2e
        run: |
          npx playwright test \
            e2e/api/health.spec.ts \
            e2e/smoke/production.spec.ts \
            --grep-invert "Security headers" \
            --project='Desktop Chrome' \
            --reporter=list,html

      - name: Stop Nuxt server
        if: always()
        run: |
          if [ -f nuxt.pid ]; then
            kill "$(cat nuxt.pid)" 2>/dev/null || true
          fi

      # On failure only: post a step-status summary to the PR so the
      # failing step is visible without needing GitHub Actions log access.
      - name: Post failure summary to PR
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          OUT_INSTALL: ${{ steps.install.outcome }}
          OUT_PG_WAIT: ${{ steps.pg-wait.outcome }}
          OUT_MIGRATE: ${{ steps.migrate.outcome }}
          OUT_SEED: ${{ steps.seed.outcome }}
          OUT_BUILD: ${{ steps.build.outcome }}
          OUT_PW_INSTALL: ${{ steps.pw-install.outcome }}
          OUT_START_SERVER: ${{ steps.start-server.outcome }}
          OUT_E2E: ${{ steps.e2e.outcome }}
        run: |
          set -e
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; skipped) echo "⏭️";; *) echo "·";; esac; }
          NUXT_TAIL=""
          if [ -f nuxt.log ]; then
            NUXT_TAIL=$(tail -100 nuxt.log)
          fi
          # Build markdown body
          {
            echo "### PR E2E (local server) — step status"
            echo
            echo "- $(icon "$OUT_INSTALL") \`install\`: ${OUT_INSTALL:-not-run}"
            echo "- $(icon "$OUT_PG_WAIT") \`pg-wait\`: ${OUT_PG_WAIT:-not-run}"
            echo "- $(icon "$OUT_MIGRATE") \`migrate\`: ${OUT_MIGRATE:-not-run}"
            echo "- $(icon "$OUT_SEED") \`seed\`: ${OUT_SEED:-not-run}"
            echo "- $(icon "$OUT_BUILD") \`build\`: ${OUT_BUILD:-not-run}"
            echo "- $(icon "$OUT_PW_INSTALL") \`pw-install\`: ${OUT_PW_INSTALL:-not-run}"
            echo "- $(icon "$OUT_START_SERVER") \`start-server\`: ${OUT_START_SERVER:-not-run}"
            echo "- $(icon "$OUT_E2E") \`e2e\`: ${OUT_E2E:-not-run}"
            echo
            if [ -n "$NUXT_TAIL" ]; then
              echo "<details><summary>nuxt.log (last 100 lines)</summary>"
              echo
              echo '```'
              echo "$NUXT_TAIL"
              echo '```'
              echo "</details>"
              echo
            fi
            echo "Run: https://github.com/${REPO}/actions/runs/${RUN_ID}"
          } > body.md

          jq -Rs '{body: .}' < body.md > payload.json

          curl -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -d @payload.json \
            -o resp.json -w "HTTP %{http_code}\n"
          head -c 500 resp.json || true

      - name: Upload Nuxt log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-server-log
          path: nuxt.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pr-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
